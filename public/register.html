<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register - Online Voting System</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .role-options {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Register</h2>
    <form id="registerForm" method="POST" action="/register">
      <label for="first_name">First Name:</label>
      <input type="text" id="first_name" name="first_name" required />
      <label for="last_name">Last Name:</label>
      <input type="text" id="last_name" name="last_name" required />
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" required />
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required />
      <label for="confirm_password">Confirm Password:</label>
      <input type="password" id="confirm_password" name="confirm_password" required />
      <label>Role:</label>
      <div class="role-options">
        <input type="radio" id="role_voter" name="role" value="voter" checked />
        <label for="role_voter">Voter</label>
        <input type="radio" id="role_admin" name="role" value="admin" />
        <label for="role_admin">Admin</label>
        <input type="radio" id="role_candidate" name="role" value="candidate" />
        <label for="role_candidate">Candidate</label>
      </div>
      <div id="electionSelection" style="display:none;">
        <label for="election_id">Select Election:</label>
        <select id="election_id" name="election_id">
          <option value="">--Select Election--</option>
        </select>
      </div>
      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="index.html">Login here</a></p>
  </div>
  <script>
    const form = document.getElementById('registerForm');
    const roleRadios = document.querySelectorAll('input[name="role"]');
    const electionSelection = document.getElementById('electionSelection');
    const electionSelect = document.getElementById('election_id');

    // Show election selection only if candidate role is selected
    roleRadios.forEach(radio => {
      radio.addEventListener('change', () => {
        if (document.getElementById('role_candidate').checked) {
          electionSelection.style.display = 'block';
          fetchElections();
        } else {
          electionSelection.style.display = 'none';
          electionSelect.innerHTML = '<option value="">--Select Election--</option>';
        }
      });
    });

    async function fetchElections() {
      try {
        const response = await fetch('/elections', { credentials: 'include' });
        if (!response.ok) throw new Error('Failed to fetch elections');
        const elections = await response.json();
        electionSelect.innerHTML = '<option value="">--Select Election--</option>';
        elections.forEach(election => {
          const option = document.createElement('option');
          option.value = election.id;
          option.textContent = election.name;
          electionSelect.appendChild(option);
        });
      } catch (error) {
        alert(error.message);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const data = {
        first_name: formData.get('first_name'),
        last_name: formData.get('last_name'),
        username: formData.get('username'),
        email: formData.get('email'),
        password: formData.get('password'),
        confirm_password: formData.get('confirm_password'),
        role: formData.get('role'),
        election_id: formData.get('role') === 'candidate' ? formData.get('election_id') : undefined
      };
      const response = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (response.redirected) {
        window.location.href = response.url;
      } else {
        const text = await response.text();
        alert(text);
      }
    });
  </script>
</body>
</html>
